<html>

        <style>

        /* BODY
           This gives the entire page a background colour */
        body {
            background-color: #59CDE9;
            font-family: Arial, sans-serif;
            color: #0A2A88;
            margin: 0;
        }

        /* HEADER
           This styles the top heading area */
        header {
            background-color: #12355b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* MAIN HEADING */
        h1 {
            margin: 10px;
        }

        /* INTRODUCTION
           This styles the welcome message */
        .intro {
            text-align: center;
            background-color: white;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }

        /* GALLERY TABLE
           This controls the table containing the pictures */
        table {
            width: 90%;
            margin: 30px auto;
            background-color:#DCFFBD;
            color:#A8CECF;
            border: 2px solid #12355b;
            border-spacing: 20px;
        }

        /* TABLE CELLS */
        td {
            text-align: center;
            padding: 15px;
        }

        /* GALLERY IMAGES
           This controls the size and appearance of the pictures */
        .gallery-image {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 3px solid #12355b;
        }

        /* HOVER EFFECT
           The image becomes slightly bigger when the mouse is placed
           over it */
        .gallery-image:hover {
            width: 190px;
            height: 190px;
        }

        /* BACK TO HOME LINK */
        .back-home {
            text-align: center;
            margin: 30px;
        }

        .back-home a {
            text-decoration: none;
            background-color: #12355b;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
        }

        /* Changes the link colour when the mouse is placed over it */
        .back-home a:hover {
            background-color: #1d6fa5;
        }

        /* SMALL PICTURES */
        .small-image {
            width: 42px;
            height: 42px;
            vertical-align: middle;
            border-radius: 50%;
        }

        /* FOOTER */
        footer {
            background-color: #12355b;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }

    </style>
